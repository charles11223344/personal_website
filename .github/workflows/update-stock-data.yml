name: Update stock data

on:
  schedule:
    - cron: "15 10-17 * * 1-5"
      timezone: "America/New_York"
    - cron: "0 9 * * 2-6"
      timezone: "America/New_York"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-data-update
  cancel-in-progress: false

jobs:
  update-stock-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch latest stock data
        run: python scripts/update_stock_data.py

      - name: Calculate latest options activity
        run: python scripts/update_options_flow_live.py || python scripts/update_options_flow.py

      - name: Commit data update
        run: |
          if git diff --quiet -- data/stocks.json data/options-flow.json; then
            echo "No stock data changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/stocks.json data/options-flow.json
            git commit -m "Update market data"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
