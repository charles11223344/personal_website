name: Update article index

on:
  push:
    branches: [main]
    paths:
      - "articles/**"
      - "scripts/build_content_index.py"
      - "tests/test_content_index.py"
      - ".github/workflows/update-content-index.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-index-update
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test article parser
        run: python -m unittest discover -s tests -p test_content_index.py
      - name: Build article index
        run: python scripts/build_content_index.py
      - name: Commit index changes
        run: |
          if ! git diff --quiet -- data/research.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/research.json
            git commit -m "Update article research index"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
